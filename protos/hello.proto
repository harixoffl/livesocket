syntax = "proto3";
 
option csharp_namespace = "VideoStreaming";
 
package videostreaming;
 
service VideoService {

    rpc StreamVideo(StreamingRequest) returns (stream VideoChunk);

}
 
message StreamingRequest {

    string video_id = 1;

}
 
message VideoChunk {

    bytes data = 1;

}


